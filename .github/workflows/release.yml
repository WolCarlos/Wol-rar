name: Build e release Rust

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
          - os: macos-15-intel
            platform: macos
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Installa Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Dipendenze Ubuntu
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - name: Test Rust
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Build Rust
        run: python scripts/build_rust.py
      - name: Smoke test Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./dist/Wol-rar.exe --gui-smoke-test
      - name: Firma applicazione Windows con certificato fornito
        if: matrix.platform == 'windows' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path certs -Force | Out-Null
          [IO.File]::WriteAllBytes("$PWD/certs/signing.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          ./scripts/sign_windows.ps1 -FilePath "$PWD/dist/Wol-rar.exe" -PfxPath "$PWD/certs/signing.pfx" -PfxPassword $env:WINDOWS_CERTIFICATE_PASSWORD
      - name: Firma sviluppo applicazione Windows
        if: matrix.platform == 'windows' && env.WINDOWS_CERTIFICATE_BASE64 == ''
        shell: pwsh
        run: ./scripts/sign_windows.ps1 -FilePath "$PWD/dist/Wol-rar.exe" -CreateSelfSigned
      - name: Build installer Windows
        if: matrix.platform == 'windows'
        run: |
          python scripts/install_inno.py
          python scripts/build_installer.py
      - name: Firma installer Windows con certificato fornito
        if: matrix.platform == 'windows' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: ./scripts/sign_windows.ps1 -FilePath "$PWD/release/Wol-rar-Setup-x64.exe" -PfxPath "$PWD/certs/signing.pfx" -PfxPassword $env:WINDOWS_CERTIFICATE_PASSWORD
      - name: Firma sviluppo installer Windows
        if: matrix.platform == 'windows' && env.WINDOWS_CERTIFICATE_BASE64 == ''
        shell: pwsh
        run: ./scripts/sign_windows.ps1 -FilePath "$PWD/release/Wol-rar-Setup-x64.exe" -CreateSelfSigned
      - name: Smoke test Ubuntu
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a ./dist/Wol-rar --gui-smoke-test
      - name: Smoke test macOS
        if: matrix.platform == 'macos'
        run: ./dist/Wol-rar.app/Contents/MacOS/Wol-rar --gui-smoke-test
      - name: Firma macOS ed eventuale notarization
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/sign_macos.sh "dist/Wol-rar.app"
      - name: Prepara pacchetto
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Wol-rar-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Prepara checksum e licenze
        run: |
          rm -f release/*.sha256 release/SHA256SUMS.txt
          cp THIRD_PARTY_NOTICES.md release/THIRD_PARTY_NOTICES.md
          cd release
          sha256sum Wol-rar-* > SHA256SUMS.txt
      - name: Firma checksum se configurata
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          if [ -n "$RELEASE_GPG_PRIVATE_KEY" ]; then
            printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
            printf '%s' "$RELEASE_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --detach-sign --armor release/SHA256SUMS.txt
          fi
      - name: Pubblica release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --title "Wol-rar ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md --verify-tag
