[package]
name = "wol-rar"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
description = "Archiviatore privato scritto in Rust per Windows, Ubuntu e macOS"
license = "LicenseRef-Proprietary"
default-run = "wol-rar"

[dependencies]
anyhow = "1.0"
bzip2 = "0.6"
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "system_fonts", "wayland", "x11", "wgpu"] }
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.16"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sevenz-rust2 = "0.25"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.23"
thiserror = "2.0"
unrar = "0.5.8"
ureq = { version = "3", features = ["json"] }
walkdir = "2.5"
xz2 = "0.1"
zeroize = "1.8"
zip = "9.4.1"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
