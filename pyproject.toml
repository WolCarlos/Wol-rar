[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wol-rar"
version = "0.2.1"
description = "Archiviatore privato per Windows, Ubuntu e macOS"
requires-python = ">=3.12"
license = {text = "Proprietary"}
dependencies = []

[project.scripts]
wol-rar = "wolrar.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
